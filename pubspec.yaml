  flutter_markdown_plus: ^1.0.12
  flutter_map: ^8.3.2
  flutter_svg: ^2.2.1
  freezed_annotation: ^3.0.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  geolocator: ^14.0.2
  geocoding: ^5.0.0
#  google_mobile_ads: ^6.0.0
  google_sign_in: ^7.2.0
  hugeicons: ^1.1.7
