  sqflite_common_ffi: ^2.4.2
  test: ^1.25.8

# google_sign_in_android 7.2.17 fails to compile its Java sources against its
# bundled Kotlin ResultUtils helper. Keep the last working Android release
# until the upstream plugin publishes a compatible fix.
dependency_overrides:
  google_sign_in_android: 7.2.16

